#!KAMAILIO
#
# SIP Leaf Phase 0 reference implementation.
# Behaviour contract: ../../config/example.yaml
# Scenario list: ../../tests/scenarios/ (spec §9)
#
# UDP only, IPv4 only, no TLS. One call is sent to one pool member; 5xx,
# transport failure and timeout advance to the next member. 486/488 and any
# other 3xx/4xx/6xx are relayed immediately. No parallel forking.
#
# Run from the repository root:
#   kamailio -f reference/kamailio/kamailio.cfg -DD -E -e
# Data file paths below are relative to this cfg file's directory.

#!define PEER_ADDR 127.0.0.1
#!ifndef PEER_PORT
#!define PEER_PORT 5060
#!endif
#!define LAN_ADDR 127.0.0.1
#!ifndef LAN_PORT
#!define LAN_PORT 5061
#!endif

#!define FLT_RINGING 1

# config/example.yaml pools.*.attempt_timeout / setup_deadline, in ms.
# attempt: no response at all (not even 100) from the current member -> next.
# deadline: no 18x within this long of the caller's INVITE -> local 503,
#   across all attempts. Once an 18x is relayed the deadline no longer applies
#   and the branch may ring up to RINGING_TIMEOUT (RFC 3261 Timer C, > 3 min).
#!define ATTEMPT_TIMEOUT 2000
#!define SETUP_DEADLINE 8000
#!define RINGING_TIMEOUT 180000

# With -A DOUBLE_RR the leaf inserts two Record-Route headers. RFC 5658 order
# is top = LAN/outgoing, second = peer-facing, so the LAN one is inserted first.

####### Global Parameters #########

debug=3
log_stderror=yes
fork=no
children=1

listen=udp:PEER_ADDR:PEER_PORT
listen=udp:LAN_ADDR:LAN_PORT

# Replies go back to the source address/port (useful with NAT endpoints).
force_rport=yes

####### Modules Section #########

# tm must be initialised before sl/dispatcher bind its API.
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "permissions.so"
loadmodule "dispatcher.so"
loadmodule "ctl.so"
loadmodule "jsonrpcs.so"

modparam("jsonrpcs", "pretty_format", 1)
modparam("ctl", "binrpc", "unix:/tmp/kamailio_sleaf_ctl")

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)
# We control the one/two Record-Route decision explicitly below.
#!ifdef DOUBLE_RR
modparam("rr", "enable_double_rr", 1)
#!else
modparam("rr", "enable_double_rr", 0)
#!endif

# Defaults only: every attempt sets its own timers with t_set_fr() from the
# time left on the setup deadline (route[ATTEMPT_TIMERS]). fr_timer runs until
# the first provisional (any 1xx, including 100, stops it, as the spec wants);
# fr_inv_timer runs after it. A static fr_inv_timer was wrong both ways: it
# cut off ringing calls after 8 s, and it was per attempt, so a member that
# sent 100 and went quiet was failed over after 8 s instead of a 503.
modparam("tm", "fr_timer", ATTEMPT_TIMEOUT)
modparam("tm", "fr_inv_timer", SETUP_DEADLINE)

# Plain filenames are resolved relative to the cfg file's directory. The two
# files are symlinks to ../../config, so YAML and Kamailio stay in sync.
modparam("permissions", "address_file", "address.list")

modparam("dispatcher", "list_file", "dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "xavp_ctx", "_dsctx_")
modparam("dispatcher", "ds_hash_size", 9)
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_timer_mode", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_from", "sip:healthcheck@127.0.0.1")

####### Routing Logic ########

route {
    xlog("L_INFO", "REQ $rm $ci $rU from $si:$sp proto=$proto len=$ml\n");

    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Conservative RFC 3261 UDP MTU. $ml is the message length pseudo-variable.
    if ($proto == "udp" && $ml > 1300) {
        sl_send_reply("513", "Message Too Large");
        exit;
    }

    # In-dialog requests need no local state: follow the Route set. BYEs pass
    # through ds_load_update() so least-calls can decrement its counters.
    if (loose_route()) {
        if (is_method("BYE|CANCEL")) {
            ds_load_update();
        }
        route(RELAY);
        exit;
    }

    # CANCEL and non-2xx ACK for a transaction this proxy created must be
    # absorbed by tm, not forwarded as a new request.
    if (t_check_trans()) {
        if (is_method("CANCEL|ACK")) {
            t_relay();
            exit;
        }
        # Retransmitted initial request: tm already has it.
        if (is_method("INVITE")) {
            exit;
        }
    }

    if (is_method("INVITE")) {
        if (!t_newtran()) {
            exit;
        }
        # Start of the setup deadline, kept with the transaction. $TV(sn) and
        # $TV(un) are the uncached clock (the cached ones are per message).
        $avp(t0s) = $TV(sn);
        $avp(t0u) = $TV(un);
        # Single network: one header. Two networks: preset both addresses in
        # RFC 5658 order — top = LAN/outgoing, second = peer-facing. Calling
        # record_route() and record_route_advertised_address() together is
        # rejected by rr ("Double attempt to record-route"), so preset is used.
        #!ifdef DOUBLE_RR
        # The preprocessor does not expand defines inside quoted strings, so
        # build the two advertised addresses from string + numeric port.
        $var(rr_peer) = "127.0.0.1:" + PEER_PORT;
        $var(rr_lan) = "127.0.0.1:" + LAN_PORT;
        record_route_preset($var(rr_lan), $var(rr_peer));
        #!else
        record_route();
        #!endif
        route(PROCESS_INVITE);
        exit;
    }

    if (is_method("ACK")) {
        # 2xx ACK without a Route set: forward it as a new transaction.
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[PROCESS_INVITE] {
    # Peer authorisation and number-selection policy are tied together: group 1
    # means the DID is in Request-URI user, group 2 means it is in To user.
    $var(group) = allow_source_address_group();
    if ($var(group) == -1) {
        sl_send_reply("403", "Forbidden");
        exit;
    }

    if ($var(group) == 1) {
        $var(number) = $rU;
    } else {
        $var(number) = $tU;
    }

    # defaults.strip_plus: true, strip_leading_zero: false
    if ($var(number) =~ "^\\+") {
        $var(number) = $(var(number){s.substr,1,0});
    }

    # Per-call rule results that failure_route[FAILOVER] needs are kept in
    # AVPs, which tm stores with the transaction. $var is per-process: a
    # timeout-triggered failure_route runs in the timer process, where $var
    # values from the request route are absent (or belong to another call),
    # and the failover INVITE then went out with the original Request-URI.
    $var(use_fixed) = 0;
    $avp(add_rule_header) = 0;
    $avp(ruri_user) = $var(number);
    $var(setid) = 1;
    $var(alg) = 10;

    # config/example.yaml rules, evaluated in file order. Exact-number rules
    # (lab-failover, test-line) must precede the broad DID rule, which would
    # otherwise match them too.
    if ($var(number) == "447700900999") {
        $avp(rule) = "lab-failover";
        $avp(ruri_user) = "0" + $(var(number){s.substr,2,0});
        $avp(add_rule_header) = 1;
        $var(setid) = 2;
        $var(alg) = 8;
    } else if ($var(number) == "447700900123") {
        $avp(rule) = "test-line";
        $var(fixed_target) = "sip:127.0.0.1:5072";
        $var(use_fixed) = 1;
    } else if ($var(number) =~ "^44[0-9]{10}$") {
        $avp(rule) = "inbound-dids";
        $avp(ruri_user) = "0" + $(var(number){s.substr,2,0});
        $avp(add_rule_header) = 1;
    } else {
        sl_send_reply("404", "Not Found");
        exit;
    }

    xlog("L_INFO", "MATCH $ci rule=$avp(rule) number=$var(number)\n");

    if ($var(use_fixed) == 1) {
        $ru = $var(fixed_target);
        # Same timers as a pool attempt; with no dispatcher list, the failure
        # route has nothing to fail over to and answers 503.
        route(ATTEMPT_TIMERS);
        t_on_failure("FAILOVER");
        t_on_reply("LOAD");
        route(RELAY);
        exit;
    }

    # Pool "dids" uses least-calls (alg 10); "lab-failover" uses priority-
    # ordered serial selection (alg 8). Remaining destinations are kept in
    # the ds XAVP list for serial failover.
    if (ds_select_dst($var(setid), $var(alg)) < 0) {
        sl_send_reply("503", "Service Unavailable");
        exit;
    }

    # Rewrite only the Request-URI user; preserve the selected member as
    # host:port. From and To are never rewritten.
    # ds_select_dst() puts the selected member in $du, not $ru.
    $var(host) = $(du{uri.host});
    $var(port) = $(du{uri.port});
    if ($var(port) == "") {
        $var(port) = "5060";
    }
    $ru = "sip:" + $avp(ruri_user) + "@" + $var(host) + ":" + $var(port);

    if ($avp(add_rule_header) == 1) {
        append_hf("X-Inbound-Rule: $avp(rule)\r\n");
    }

    route(ATTEMPT_TIMERS);
    t_on_failure("FAILOVER");
    t_on_reply("LOAD");
    route(RELAY);
}

# Sets $var(remaining): ms left on the setup deadline (may be <= 0).
route[DEADLINE] {
    $var(elapsed) = ($TV(sn) - $avp(t0s)) * 1000 + ($TV(un) - $avp(t0u)) / 1000;
    $var(remaining) = SETUP_DEADLINE - $var(elapsed);
}

# Timers for a new attempt: no response at all within ATTEMPT_TIMEOUT (capped
# by the deadline), and after a 100, no 18x before the deadline.
route[ATTEMPT_TIMERS] {
    route(DEADLINE);
    if ($var(remaining) < 1) {
        $var(remaining) = 1;
    }
    $var(attempt) = ATTEMPT_TIMEOUT;
    if ($var(remaining) < $var(attempt)) {
        $var(attempt) = $var(remaining);
    }
    t_set_fr($var(remaining), $var(attempt));
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
}

onreply_route[LOAD] {
    # A final response after ringing is relayed, never failed over (spec §9).
    # The first 18x also ends the setup deadline: let the branch ring.
    if (is_method("INVITE") && t_check_status("1[89][0-9]")) {
        setflag(FLT_RINGING);
        t_set_fr(RINGING_TIMEOUT);
    } else if (is_method("INVITE") && t_check_status("1[0-7][0-9]")
            && !isflagset(FLT_RINGING)) {
        # 100 Trying: tm switches this branch to fr_inv_timer counted from
        # now, so re-arm it with what is left of the deadline.
        route(DEADLINE);
        if ($var(remaining) < 1) {
            $var(remaining) = 1;
        }
        t_set_fr($var(remaining));
    }
    if (is_method("INVITE") && t_check_status("2[0-9][0-9]")) {
        ds_load_update();
    }
}

failure_route[FAILOVER] {
    $var(failstatus) = 0;
    if (t_check_status("(5[0-9][0-9]|408)")) {
        $var(failstatus) = 1;
    }
    xlog("L_INFO", "FAIL $ci status=$rs rc=$rc failstatus=$var(failstatus)\n");
    if (t_is_canceled()) {
        exit;
    }

    # 180/183 means the caller has seen progress: relay the final response,
    # even if it is a 5xx. This is the "ring then 5xx, no failover" case.
    if (isflagset(FLT_RINGING)) {
        ds_load_unset();
        exit;
    }

    # Fail over only on 5xx, 408 ($rc=0 for SIP replies) or a transport/
    # timeout branch failure ($rc=-1). Other final replies are relayed.
    if ($var(failstatus) == 0 && $rc != -1) {
        exit;
    }

    ds_load_unset();

    # No 18x by the setup deadline: stop, whichever attempt we are on.
    route(DEADLINE);
    if ($var(remaining) < 100) {
        xlog("L_INFO", "DEADLINE $ci elapsed=$var(elapsed)ms\n");
        t_reply("503", "Service Unavailable");
        exit;
    }

    if (ds_next_dst()) {
        # Rebuild the rewritten Request-URI on the next selected member. The
        # branch starts from the caller's original Request-URI, so this must
        # always happen; the rewrite comes from transaction AVPs (see above).
        $var(host) = $(du{uri.host});
        $var(port) = $(du{uri.port});
        if ($var(port) == "") {
            $var(port) = "5060";
        }
        $ru = "sip:" + $avp(ruri_user) + "@" + $var(host) + ":" + $var(port);
        route(ATTEMPT_TIMERS);
        t_on_failure("FAILOVER");
        t_on_reply("LOAD");
        route(RELAY);
        exit;
    }

    t_reply("503", "Service Unavailable");
}

event_route[dispatcher:dst-down] {
    xlog("L_WARN", "DOWN $ru\n");
}

event_route[dispatcher:dst-up] {
    xlog("L_INFO", "UP $ru\n");
}
